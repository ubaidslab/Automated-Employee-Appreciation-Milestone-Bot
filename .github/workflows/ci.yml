name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # The build needs *some* value for these so route/page collection
      # doesn't throw — none of it is a real secret.
      DATABASE_URL: "file:./ci.db"
      ADMIN_KEY: "ci-placeholder-admin-key"
      SESSION_SECRET: "ci-placeholder-session-secret"
      CRON_SECRET: "ci-placeholder-cron-secret"
      SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/placeholder"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
